appId: com.shanhai.desktop
productName: 山海
copyright: Copyright © 2026 山海

# 产物输出目录与资源目录
directories:
  output: release
  buildResources: assets

# 打包内容：只带编译产物 + package.json；node_modules 由 electron-builder 按 dependencies 自动收集
files:
  - dist/**
  - assets/**
  - package.json
  - "!dist/**/*.map"
  - "!node_modules/**/*.map"
  - "!**/.DS_Store"

# 原生模块与 wasm 资源必须解包到真实文件系统（asar 内无法被 worker_threads / require 原生 .node 加载）
# esbuild 平台二进制（@esbuild/*/bin/esbuild）同理：asar 内无法 spawn 执行，需解包，否则插件「现场编译」不可用
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/wasm-feature-detect/**
  - node_modules/esbuild/**
  - node_modules/@esbuild/**

mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  icon: assets/icon.icns
  category: public.app-category.productivity
  # 签名 + 公证所需的 hardened runtime 与 entitlements
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 用 Developer ID Application 证书签名（本机已存在唯一一张 Developer ID Application）
  identity: "Shenzhen Zhongyun Technology Co., Limited (AAHRV8JQ39)"

dmg:
  artifactName: Shanhai-${version}-${arch}.${ext}
  title: 山海

# Windows 打包：NSIS 安装包 + 便携版（portable 免 wine，便于在 mac 上交叉验证）
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: assets/icon.ico
  # 可执行文件名用英文（避免 Windows 上「山海.exe」中文名带来的路径/兼容问题）；
  # 快捷方式与菜单显示名仍由 productName「山海」+ shortcutName「山海」控制，保持中文。
  executableName: Shanhai

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: Shanhai-${version}-${arch}.${ext}
  shortcutName: 山海
  uninstallDisplayName: 山海

portable:
  artifactName: Shanhai-${version}-${arch}-portable.${ext}

# 递增 build code（根配置字段，映射 macOS 的 CFBundleVersion / Windows 的 FileVersion）
# 与网关 version_code（递增整数）同量纲，供版本检查「版本字符串相同但 build code 更高」场景比较
# （app-updater 读 CFBundleVersion）。每次发版手动 +1。
buildVersion: "2"

# 原生模块在打包前手动 @electron/rebuild（pnpm 下 npmRebuild 不可靠，故关闭）
npmRebuild: false
electronVersion: 43.4.0
# 说明：electronDist 已移除（不再写死本机 mac 版 electron）。
#   - mac 打包：由 dist:mac 脚本通过 --config.electronDist=node_modules/electron/dist 显式复用本机已下载的 electron，保持快速；
#   - win 交叉打包：不传 electronDist，让 electron-builder 按 electronVersion 下载对应平台的 win 版 electron。
